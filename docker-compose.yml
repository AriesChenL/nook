name: nook-infra

services:

  postgres:
    image: postgres:latest
    container_name: nook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nook
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8.6
    container_name: nook-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis123", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:latest
    container_name: nook-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"   # 主端口 / 客户端 open-API
      - "9848:9848"   # gRPC 客户端端口
      - "8849:8080"   # Nacos 3.x 控制台（容器内 8080，宿主 8080 被网关占用故映射到 8849）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

  rocketmq-namesrv:
    image: apache/rocketmq:latest
    container_name: nook-rmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:latest
    container_name: nook-rmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n nook-rmq-namesrv:9876 --enable-proxy
    environment:
      NAMESRV_ADDR: nook-rmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "18081:8081"  # gRPC proxy（避开 nook-auth 的 8081）

  # RustFS：S3 兼容对象存储，IM 文件/图片/音视频直传
  rustfs:
    image: rustfs/rustfs:latest
    container_name: nook-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfssecret      # 与 nook-im application.yml 的 nook.storage.secret-key 保持一致
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API（presigned 直传 + 公开读下载）
      - "9001:9001"   # Web 控制台
    volumes:
      - rustfs-data:/data

volumes:
  pg-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rustfs-data:
