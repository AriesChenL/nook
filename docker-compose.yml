name: nook-infra

services:

  postgres:
    image: postgres:latest
    container_name: nook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nook
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      # 数据库 schema 改由 Flyway 在应用启动时管理（迁移脚本在 nook-common/db/migration）。
      # 不再用 initdb.d（它只在空卷首启时跑一次、不跟踪增量）。

  redis:
    image: redis:latest
    container_name: nook-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis123", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:latest
    container_name: nook-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"   # 主端口 / 客户端 open-API
      - "9848:9848"   # gRPC 客户端端口
      - "8849:8080"   # Nacos 3.x 控制台（容器内 8080，宿主 8080 被网关占用故映射到 8849）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

  # RabbitMQ：IM 事件广播（新消息 / 撤回 / 在线状态），management 镜像自带 WebUI
  rabbitmq:
    image: rabbitmq:management
    container_name: nook-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nook
      RABBITMQ_DEFAULT_PASS: nook123      # 与 nook-im application.yml 的 spring.rabbitmq 保持一致
    ports:
      - "5672:5672"     # AMQP（应用连接）
      - "15672:15672"   # 管理控制台 WebUI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # RustFS：S3 兼容对象存储，IM 文件/图片/音视频直传
  rustfs:
    image: rustfs/rustfs:latest
    container_name: nook-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfssecret      # 与 nook-im application.yml 的 nook.storage.secret-key 保持一致
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API（presigned 直传 + 公开读下载）
      - "9001:9001"   # Web 控制台
    volumes:
      - rustfs-data:/data

volumes:
  pg-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rustfs-data:
  rabbitmq-data:
