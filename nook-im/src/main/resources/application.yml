server:
  port: 8083

spring:
  application:
    name: nook-im

  # DataSource / Redis / RabbitMQ / 对象存储凭据来自 Nacos 共享配置 nook-shared.yml。
  config:
    import:
      - nacos:nook-shared.yml?group=DEFAULT_GROUP&refreshEnabled=true

  # Flyway：迁移脚本在 nook-common 的 classpath:db/migration（已有库采纳现状为基线）
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}

mybatis-flex:
  global-config:
    print-banner: false

nook:
  im:
    # 消息分发：开启后走 RabbitMQ 广播 exchange（多实例）；关闭则进程内本地直推（单实例）
    mq:
      enabled: true
  # 对象存储（RustFS / S3 兼容）：endpoint / access-key / secret-key 在 nook-shared.yml，这里只放本服务的业务字段
  storage:
    bucket: nook-im
    public-base-url: ${NOOK_STORAGE_PUBLIC_BASE_URL:http://localhost:9000/nook-im}   # 下载/预览前缀（bucket 公开读）
    presign-expire-seconds: 600                      # 预签名上传 URL 有效期
    max-file-size: 209715200                         # 单文件上限 200MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lynn.nook: DEBUG
