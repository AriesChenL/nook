server:
  port: 8083

spring:
  application:
    name: nook-im

  datasource:
    url: jdbc:postgresql://localhost:5432/nook
    username: nook
    password: nook123
    driver-class-name: org.postgresql.Driver

  # Flyway：迁移脚本在 nook-common 的 classpath:db/migration（已有库采纳现状为基线）
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
      timeout: 3s

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        import-check:
          enabled: false

mybatis-flex:
  global-config:
    print-banner: false

# RocketMQ：默认关闭，单机开发不需要 broker；多实例部署改为 true。
nook:
  im:
    mq:
      enabled: false
  # 对象存储（RustFS / S3 兼容）：预签名直传 + 公开读下载
  storage:
    endpoint: http://localhost:9000          # 浏览器可达地址，作为 presigned URL 的 host
    access-key: rustfsadmin
    secret-key: rustfssecret
    bucket: nook-im
    public-base-url: http://localhost:9000/nook-im   # 下载/预览前缀（bucket 公开读）
    presign-expire-seconds: 600              # 预签名上传 URL 有效期
    max-file-size: 209715200                 # 单文件上限 200MB

rocketmq:
  name-server: localhost:9876
  producer:
    group: nook-im-producer
    send-message-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lynn.nook: DEBUG
