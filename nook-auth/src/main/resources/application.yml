server:
  port: 8081

spring:
  application:
    name: nook-auth

  datasource:
    url: jdbc:postgresql://localhost:5432/nook
    username: nook
    password: nook123
    driver-class-name: org.postgresql.Driver

  # Flyway：迁移脚本在 nook-common 的 classpath:db/migration（已有库采纳现状为基线）
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
      timeout: 3s

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        import-check:
          enabled: false
        # 跨服务共享项（JWT 密钥等）统一放 nook-shared.yml，见 docs/nacos/nook-shared.yml
        shared-configs:
          - data-id: nook-shared.yml
            group: DEFAULT_GROUP
            refresh: true

mybatis-flex:
  global-config:
    print-banner: false

nook:
  jwt:
    # 生产：由 Nacos 共享配置 nook-shared.yml 覆盖；本地未接 Nacos 时用下面的开发默认值（HS256 需 ≥32 字节）
    secret: ${NOOK_JWT_SECRET:dev-only-nook-jwt-secret-change-me-at-least-32-bytes-long}
    expire-minutes: 1440

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lynn.nook: DEBUG
