server:
  port: 8081

spring:
  application:
    name: nook-auth

  # DataSource / Redis / JWT 等敏感与跨服务配置来自 Nacos 共享配置 nook-shared.yml（见下方 shared-configs）。
  # 本地未接 Nacos 无法启动 —— 先跑 scripts/nacos/push-shared-config.sh（或 nook.bat up 自动推）。

  # Flyway：迁移脚本在 nook-common 的 classpath:db/migration（已有库采纳现状为基线）
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        import-check:
          enabled: false
        shared-configs:
          - data-id: nook-shared.yml
            group: DEFAULT_GROUP
            refresh: true

mybatis-flex:
  global-config:
    print-banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lynn.nook: DEBUG
