server:
  port: 8080

spring:
  application:
    name: nook-gateway

  # Redis / JWT 密钥来自 Nacos 共享配置 nook-shared.yml。
  config:
    import:
      - nacos:nook-shared.yml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false           # 关闭"按服务名自动建路由"，走显式配置
          globalcors:
            cors-configurations:
              '[/**]':
                # 生产改成真实前端域名（P0 待办）
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: auth
              uri: lb://nook-auth
              predicates:
                - Path=/auth/**
            - id: user
              uri: lb://nook-user
              predicates:
                - Path=/user/**
            - id: im
              uri: lb://nook-im
              predicates:
                - Path=/im/**
            - id: ai
              uri: lb://nook-ai
              predicates:
                - Path=/ai/**
            - id: pay
              uri: lb://nook-pay
              predicates:
                - Path=/pay/**

nook:
  gateway:
    # 不需要 JWT 校验的路径前缀（注册、登录、健康检查、Stripe 回调）
    whitelist:
      - /auth/register
      - /auth/login
      - /actuator/**
      - /pay/webhook/**   # Stripe 回调无 JWT，由 Stripe 签名校验来源

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.lynn.nook: DEBUG
