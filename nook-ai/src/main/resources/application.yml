server:
  port: 8084

spring:
  application:
    name: nook-ai

  # 本地密钥文件（properties 格式，如 DEEPSEEK_API_KEY=sk-xxx）。optional=不存在不报错；
  # 两条分别覆盖「工作目录=模块目录」(spring-boot:run / IDE) 与「工作目录=仓库根」两种启动方式。
  # .env 已被根 .gitignore 忽略；模板见 nook-ai/.env.example。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:nook-ai/.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/nook
    username: nook
    password: nook123
    driver-class-name: org.postgresql.Driver

  # 迁移脚本在 nook-common 的 classpath:db/migration。
  # baseline-on-migrate：已有库(无 history 表)时采纳现状为基线 V1，不重跑建表。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        import-check:
          enabled: false

# ───────────── ORM ─────────────
mybatis-flex:
  global-config:
    print-banner: false

# ───────────── nook-ai ─────────────
# DeepSeek 模型 + agentscope 官方 PG 存储落表位置 + 上下文压缩阈值。代码里不留裸字面量。
# 本地工作区目录不在此配：用 agentscope 默认 ./.agentscope/workspace（仅索引锚点，内容全部入 PG），
# 需要时用环境变量 AGENTSCOPE_WORKSPACE 或 -Dagentscope.workspace 覆盖。
nook:
  ai:
    deepseek:                       # OpenAI 兼容协议；api-key 走 .env / 环境变量
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
    store:                          # agentscope 官方 PG 存储
      schema: public
      fs-table: agentscope_fs_store
      state-table: agentscope_state
    compaction:
      trigger-messages: 40
      keep-messages: 15

# ───────────── 运维 ─────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lynn.nook: DEBUG
    # DEBUG 打印每次发往 LLM 的原始请求体 JSON（OpenAIClient 的 "OpenAI (streaming) request to {}: {}"）
    io.agentscope.extensions.model.openai: DEBUG
