server:
  port: 8084

spring:
  application:
    name: nook-ai

  # 本地密钥文件（properties 格式，如 DEEPSEEK_API_KEY=sk-xxx）。optional=不存在不报错。
  # 作用：给 Nacos 共享配置里的 ${DEEPSEEK_API_KEY} 提供取值（等价于设环境变量）。
  # 两条分别覆盖「工作目录=模块目录」(spring-boot:run / IDE) 与「工作目录=仓库根」两种启动方式。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:nook-ai/.env[.properties]
      - nacos:nook-shared.yml?group=DEFAULT_GROUP&refreshEnabled=true

  # DataSource / DeepSeek key / 对象存储凭据来自 Nacos 共享配置 nook-shared.yml。

  # 迁移脚本在 nook-common 的 classpath:db/migration。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}

# ───────────── ORM ─────────────
mybatis-flex:
  global-config:
    print-banner: false

# ───────────── nook-ai ─────────────
# DeepSeek 模型（api-key 在 nook-shared.yml）+ agentscope 官方 PG 存储落表位置 + 上下文压缩阈值 + 免费版额度。
# 本地工作区目录用 agentscope 默认 ./.agentscope/workspace（仅索引锚点，内容全部入 PG）。
nook:
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash-0731   # 2026-07-31 生产版：重做 post-training，coding/推理/agent 更强；固定日期快照便于复现
    store:                          # agentscope 官方 PG 存储
      schema: public
      fs-table: agentscope_fs_store
      state-table: agentscope_state
    compaction:
      trigger-messages: 40
      keep-messages: 15
    quota:                          # 免费版额度（付费用户不受限；权益经 nook-pay 查询，查不到则放行）
      free:
        max-agents: 3
        daily-messages: 20

# ───────────── 运维 ─────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lynn.nook: DEBUG
    # DEBUG 打印每次发往 LLM 的原始请求体 JSON（OpenAIClient 的 "OpenAI (streaming) request to {}: {}"）
    io.agentscope.extensions.model.openai: DEBUG
